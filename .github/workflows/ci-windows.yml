name: CI – Windows Debug Build

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Install Cppcheck
        run: |
          choco install cppcheck -y
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
      
      - name: Run Cppcheck
        shell: cmd
        run: |
          where cppcheck
          cppcheck --version
          cppcheck --enable=all --inconclusive --std=c++20 --output-file=cppcheck-report.txt inc src test/inc test/src type cppcheck-report.txt
  
  build:
    needs: analyze
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.7.0 (MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.0'
          target: desktop
          arch: win64_msvc2019_64

      - name: Install CMake
        run: |
          choco install ninja -y
          choco install cmake --version=4.0.3 -y

      - name: Build Application Exe (Debug)
        run: | 
          cmake -S . -B build -G "Ninja Multi-Config" -DRUN_TESTS=OFF
          cmake --build build --config Debug --parallel

      - name: Build Test Exe (Debug)
        run: | 
          cmake -S . -B build-tests -G "Ninja Multi-Config" -DRUN_TESTS=ON
          cmake --build build-tests --config Debug --parallel

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-exe-debug
          path: out/Debug/TennisDesktopApp_test.exe
          if-no-files-found: error
          
  test:
    needs: build 
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Qt 6.7.0 (MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.0'
          target: desktop
          arch: win64_msvc2019_64
      
      - name: Download Test Executable
        uses: actions/download-artifact@v4
        with:
          name: test-exe-debug
          path: tests-run
      
      - name: Run Tests
        shell: cmd
        run: tests-run\TennisDesktopApp_test.exe --gtest_color=yes --gtest_output=xml:TEST-debug.xml
