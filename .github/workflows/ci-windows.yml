name: CI – Windows Build, Static Analysis & Tests (Debug-only)

on:
  workflow_dispatch:

jobs:
  build-analyze-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.7.0 (MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.0'
          target: desktop
          arch: win64_msvc2019_64

      - name: Install dependencies
        run: |
          choco install ninja -y
          choco install cmake --version=4.0.3 -y
          choco install cppcheck -y
          Import-Module "$env:ChocolateyInstall/helpers/chocolateyInstaller.psm1"
          refreshenv

      - name: Configure without tests
        run: cmake -S . -B build -G "Ninja Multi-Config" -DRUN_TESTS=OFF

      - name: Build Debug (application only)
        run: cmake --build build --config Debug --parallel

      - name: Run Cppcheck static analysis
        run: |
          cppcheck --enable=all --inconclusive --std=c++20 --error-exitcode=1 \
                   src inc test/src test/inc

      - name: Reconfigure with tests
        run: cmake -S . -B build -G "Ninja Multi-Config" -DRUN_TESTS=ON

      - name: Build Debug including tests
        run: cmake --build build --config Debug --parallel

      - name: Run test executable directly
        run: build\Debug\TennisDesktopApp_test.exe --gtest_color=yes

      - name: Upload Debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug
          path: build/Debug/**
